# Dokploy deployment — build new-api from this repository's source.
#
# In Dokploy: Create Service -> Compose -> Provider = Git (this fork),
# Compose Path = ./docker-compose.dokploy.yml.
# Set the variables below in the service's "Environment" tab, then add a Domain
# with Service Name = new-api, Container Port = 3000, HTTPS + Let's Encrypt.
#
# Required environment variables (Dokploy Environment tab):
#   APP_ORIGIN=https://api.example.com   # exact public HTTPS origin, no trailing slash
#   POSTGRES_PASSWORD=<strong-password>
#   REDIS_PASSWORD=<strong-password>
#   SESSION_SECRET=<long-random-string>

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: --log-dir /app/logs
    environment:
      - SQL_DSN=postgresql://newapi:${POSTGRES_PASSWORD}@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      # Served over HTTPS by Traefik: Secure cookies + strict refresh/logout OriginGuard.
      # SESSION_COOKIE_TRUSTED_URL must list every exact browser origin (comma separated,
      # no wildcards, no paths). This is not the relay CORS allowlist.
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_TRUSTED_URL=${APP_ORIGIN}
      # Unset trusts loopback/RFC1918/fc00::/7 and logs a startup warning. To silence it,
      # pin the Docker subnet Traefik reaches this container from:
      #   docker network inspect dokploy-network -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
      # - TRUSTED_PROXIES=10.0.0.0/24
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=aoso-node-1
      # - STREAMING_TIMEOUT=300
    volumes:
      - new_api_data:/data
      - new_api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      # Traefik lives on dokploy-network; without it the Domain cannot route here.
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - internal

volumes:
  new_api_data:
  new_api_logs:
  pg_data:
  redis_data:

networks:
  dokploy-network:
    external: true
  internal:
